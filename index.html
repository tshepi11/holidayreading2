<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grade 2 Holiday Reading</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Lora:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#1A1814;--soft:#6B6355;--paper:#FBF7EF;--card:#FFF;--rule:#E3DCCC;
 --accent:#1668A8;--accent-l:#E4EFF7;--good:#2E7D4F;--bad:#C0392B;--fs:19px}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:"Lora",Georgia,serif;
 line-height:1.65;padding:0 0 70px}
.wrap{max-width:760px;margin:0 auto;padding:0 20px}
button{font-family:inherit;cursor:pointer}
header{padding:34px 0 22px;border-bottom:3px solid var(--ink)}
.kicker{font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600;
 letter-spacing:.16em;text-transform:uppercase;color:var(--soft)}
h1{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;
 font-size:clamp(32px,7vw,54px);line-height:.96;letter-spacing:-.02em;margin:10px 0 12px}
.lede{font-size:15px;color:var(--soft);max-width:54ch}
.shelf{display:grid;gap:14px;margin-top:26px}
.book{display:grid;grid-template-columns:64px 1fr;gap:16px;align-items:start;background:var(--card);
 border:1.5px solid var(--rule);border-radius:3px;padding:16px 18px;text-align:left;width:100%}
.book:hover{border-color:var(--accent)}
.book:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.spine{background:var(--accent);border-radius:2px;height:88px;display:flex;flex-direction:column;align-items:center;
 justify-content:center;line-height:1;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;
 font-size:30px;color:#fff}
.bt{display:block;font-family:"Bricolage Grotesque",sans-serif;font-weight:600;font-size:20px;
 line-height:1.15;margin-bottom:5px}
.bb{display:block;font-size:14px;color:var(--soft);line-height:1.5;margin-bottom:9px}
.meta{display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-family:"IBM Plex Mono",monospace;
 font-size:11px;color:var(--soft);letter-spacing:.05em;text-transform:uppercase}
.badge{background:var(--good);color:#fff;padding:3px 8px;border-radius:2px;font-weight:600}
.resume{background:var(--accent-l);color:var(--accent);padding:3px 8px;border-radius:2px;font-weight:600}
.reader{display:none}.reader.on{display:block}.shelfview.off{display:none}
.rbar{display:flex;align-items:center;gap:12px;padding:16px 0;border-bottom:1.5px solid var(--rule);flex-wrap:wrap}
.back{background:none;border:0;font-family:"IBM Plex Mono",monospace;font-size:12px;
 letter-spacing:.08em;text-transform:uppercase;color:var(--soft);padding:6px 0}
.rtitle{font-family:"Bricolage Grotesque",sans-serif;font-weight:600;font-size:16px;flex:1}
.sizer{display:flex;border:1.5px solid var(--rule);border-radius:2px;overflow:hidden}
.sizer button{background:var(--card);border:0;padding:5px 11px;font-size:13px;
 font-family:"IBM Plex Mono",monospace;color:var(--soft)}
.sizer button+button{border-left:1.5px solid var(--rule)}
.pagewrap{min-height:46vh;display:flex;align-items:center;padding:34px 0 10px}
.page{font-size:var(--fs);line-height:1.85}
.page p{margin-bottom:1.05em}.page p:last-child{margin-bottom:0}
.chap{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:.72em;
 letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:1.1em}
.nav{display:flex;align-items:center;gap:14px;padding:16px 0 0;border-top:1.5px solid var(--rule)}
.nav button{background:var(--ink);color:var(--paper);border:0;border-radius:2px;padding:11px 22px;
 font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.09em;
 text-transform:uppercase;font-weight:600}
.nav button[disabled]{opacity:.28;cursor:default}
.pnum{flex:1;text-align:center;font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--soft)}
.bar{height:5px;background:var(--rule);margin-top:14px}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.sp{display:none;padding-top:8px}.sp.on{display:block}
.sh{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:26px;margin:26px 0 6px}
.si{font-size:15px;color:var(--soft);margin-bottom:20px;max-width:56ch}
.mode{display:flex;border:1.5px solid var(--ink);border-radius:2px;overflow:hidden;
 width:max-content;margin-bottom:22px}
.mode button{background:transparent;border:0;padding:9px 16px;font-family:"IBM Plex Mono",monospace;
 font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--ink)}
.mode button+button{border-left:1.5px solid var(--ink)}
.mode button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.item{padding:14px 0;border-bottom:1px solid var(--rule)}
.itop{display:flex;gap:12px;align-items:center;margin-bottom:9px}
.n{font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--soft);min-width:24px}
.say{background:var(--accent-l);color:var(--accent);border:1.5px solid var(--accent);
 border-radius:2px;padding:7px 14px;font-family:"IBM Plex Mono",monospace;font-size:12px;
 letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.say:hover{background:var(--accent);color:#fff}
.clue{font-size:16px;line-height:1.55;flex:1}
.ans{display:flex;gap:10px;align-items:center;padding-left:36px}
.ans input{font-family:"Lora",serif;font-size:17px;padding:9px 11px;flex:1;max-width:300px;
 border:1.5px solid var(--rule);border-radius:2px;background:var(--card);color:var(--ink)}
.ans input:focus{outline:0;border-color:var(--accent)}
.ans input.ok{border-color:var(--good);background:#F2F9F5}
.ans input.no{border-color:var(--bad);background:#FDF3F2}
.tick{font-size:19px}.tick.ok{color:var(--good)}.tick.no{color:var(--bad)}
.hint{font-family:"IBM Plex Mono",monospace;font-size:13px;letter-spacing:.2em;color:var(--soft)}
.acts{display:flex;gap:10px;margin-top:24px;flex-wrap:wrap}
.acts button{border:1.5px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:2px;
 padding:11px 20px;font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.09em;
 text-transform:uppercase;font-weight:600}
.acts button.ghost{background:transparent;color:var(--ink)}
.score{margin-top:22px;padding:16px 18px;background:var(--accent-l);border-left:4px solid var(--accent);
 font-size:16px;display:none}
.score.on{display:block}
.novoice{font-size:13px;color:var(--bad);margin-bottom:16px;display:none}
.novoice.on{display:block}
@media(max-width:560px){.book{grid-template-columns:46px 1fr;gap:12px}.spine{height:70px;font-size:24px}
 .ans{padding-left:0}.itop{flex-wrap:wrap}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
<div class="shelfview" id="shelfview">
  <header>
    <div class="kicker">Grade 2 · Holidays</div>
    <h1>Holiday Reading</h1>
    <p class="lede">One book for each day of the holidays. Each one is 24 pages, and there is a spelling test at the back when you finish.</p>
  </header>
  <div class="shelf" id="shelf"></div>
</div>

<div class="reader" id="reader">
  <div class="rbar">
    <button class="back" id="back">&#8592; Shelf</button>
    <span class="rtitle" id="rtitle"></span>
    <span class="sizer">
      <button id="smaller" aria-label="Smaller text">A&#8722;</button>
      <button id="bigger" aria-label="Bigger text">A+</button>
    </span>
  </div>
  <div id="storyview">
    <div class="pagewrap"><div class="page" id="page"></div></div>
    <div class="nav">
      <button id="prev">Back</button>
      <span class="pnum" id="pnum"></span>
      <button id="next">Next</button>
    </div>
    <div class="bar"><i id="bar"></i></div>
  </div>
  <div class="sp" id="sp">
    <div class="sh">Spelling Test</div>
    <p class="si" id="si"></p>
    <div class="mode" role="group" aria-label="Choose how to practise">
      <button id="mListen" aria-pressed="true">Listen &amp; type</button>
      <button id="mMean" aria-pressed="false">What is the word?</button>
    </div>
    <p class="novoice" id="novoice">This browser will not read the words out. Use <b>What is the word?</b> instead, or ask a grown-up to read them to you.</p>
    <div id="items"></div>
    <div class="acts">
      <button id="check">Check my answers</button>
      <button class="ghost" id="clear">Clear</button>
      <button class="ghost" id="reread">Read it again</button>
    </div>
    <div class="score" id="score"></div>
  </div>
</div>
</div>
<script>
const BOOKS = [{"title": "The Cousins Are Coming", "blurb": "Three cousins are coming to stay for the whole holiday. Zinhle has to share her room, and she has been dreading it for a week.", "n": 1, "pages": [["## One", "The cousins were coming on Saturday and Zinhle had known about it for eleven days."], ["Eleven days is a long time to think about something.", "By Thursday she had thought about it so much that she had made herself cross."], ["There were three of them. Buhle was ten. The twins were six.", "They were coming for the whole holiday. All of it."], ["## Two", "The problem was the room.", "Zinhle had her own room. She had had her own room for two years, since her brother moved out."], ["Now there would be a mattress on the floor for Buhle and another one for the twins, and there would be almost no floor left at all."], ["“It is nine days,” said her mother.", "“Nine days is long.”", "“Nine days is nine days,” said her mother, which was not an answer."], ["## Three", "They arrived at eleven o'clock on Saturday in a white bakkie."], ["The twins got out first and ran straight past Zinhle into the house without saying hello.", "Buhle got out slowly and stood next to the bakkie holding a bag."], ["She did not look pleased either.", "Zinhle had not thought about that. She had not once thought about whether Buhle wanted to come."], ["## Four", "The first day was bad.", "The twins found Zinhle's box of beads and tipped it out on the floor. It took an hour to pick them all up."], ["The second day was worse.", "Buhle would not talk. She lay on her mattress and read the same book all afternoon and answered every question with one word."], ["That night Zinhle lay in the dark and counted. Seven more days."], ["## Five", "It was the rain that changed it."], ["On the third day it rained so hard that nobody could go outside at all, not even to the shop.", "By eleven o'clock everybody was bored and the twins had started fighting."], ["Zinhle got out the beads again. She did not want to. She did it because there was nothing else."], ["## Six", "Buhle looked up from her book.", "“Can I?” she said."], ["They made bracelets all afternoon. Buhle was much better at it than Zinhle, which was annoying for about ten minutes and then stopped being annoying."], ["The twins made a bracelet each and then lost interest and went to build something out of cushions in the passage."], ["## Seven", "“I did not want to come,” said Buhle, without looking up.", "“I know.”", "“It is not you. My mother is working. There was nowhere else.”"], ["Zinhle did not know what to say to that, so she said nothing, and passed her the red beads, which were the best ones."], ["## Eight", "The other six days went fast.", "They built a shop out of boxes and made the twins be customers. They sold each other bracelets for stones."], ["On the last night the twins fell asleep first, the way small children do, in the middle of talking."], ["“Same time in December?” said Buhle in the dark.", "“Yes,” said Zinhle, and she meant it, which surprised her."], ["The bakkie came at ten the next morning.", "The room was very big and very quiet after they left.", "Zinhle did not like it as much as she thought she would."]], "wc": 526, "words": [{"w": "cousins", "m": "the children of your aunt or uncle"}, {"w": "holiday", "m": "time away from school"}, {"w": "mattress", "m": "you sleep on it"}, {"w": "floor", "m": "you walk on it"}, {"w": "beads", "m": "small round things you make jewellery with"}, {"w": "bracelet", "m": "you wear it on your wrist"}, {"w": "customer", "m": "a person who buys something"}, {"w": "annoying", "m": "it makes you cross"}, {"w": "passage", "m": "a narrow place you walk through in a house"}, {"w": "quiet", "m": "not making any noise"}]}, {"title": "The Dog With No Name", "blurb": "A dog follows Lwazi home on the first day of the holidays. His mother says it cannot stay. It stays.", "n": 2, "pages": [["## One", "It started outside the spaza shop on the first morning of the holidays."], ["Lwazi bought a cooldrink. When he turned around there was a dog sitting behind him, watching him."], ["It was brown and white. It was not very big. It had one ear up and one ear down and it looked as if it had been thinking about something for a long time."], ["## Two", "He walked home. The dog walked home too, about four steps behind him, the whole way."], ["When he got to the gate he turned around.", "“Go,” he said.", "The dog sat down."], ["“Go home.”", "The dog lay down."], ["## Three", "His mother saw it through the kitchen window.", "“No,” she said, before he had said anything at all."], ["“I did not—”", "“No.”", "“It followed me.”", "“They always follow somebody,” said his mother. “It cannot stay.”"], ["## Four", "It stayed."], ["It stayed outside the gate, not inside it, which Lwazi thought was clever of it.", "It was still there at lunchtime. It was still there at four o'clock."], ["At six o'clock it started to rain and his mother stood at the window for a while and did not say anything, and then she took out an old towel and said, “On the step. Not inside the door. The step.”"], ["## Five", "The dog slept on the step for four nights."], ["On the fifth night it rained again, harder, and in the morning the dog was inside the door and nobody said one word about it."], ["Lwazi did not ask. He had learned that some things work better if you do not ask."], ["## Six", "They did not give it a name for a long time.", "His mother said that if you name a thing you have kept it, and they were not keeping it, they were only letting it stay."], ["So for two weeks it was just <i>the dog</i>.", "“Has the dog eaten?”", "“The dog is at the gate.”", "“Move, dog.”"], ["## Seven", "Then a man came down the road asking about a brown dog."], ["Lwazi's stomach went cold and tight. He stood in the doorway and did not say anything at all while his mother talked to the man at the gate."], ["The man looked at the dog for a while.", "“Not mine,” he said. “Mine has a black tail.”", "And he went away down the road."], ["## Eight", "That night at supper his mother said, “We cannot keep calling it the dog.”"], ["Lwazi put down his fork.", "“So we are keeping it.”", "“I did not say that.”", "“You said we cannot keep calling it the dog. That means—”", "“Eat your food,” said his mother."], ["They called it Sipho, which means <i>we were given</i>, and which was his mother's idea, and which she pretended afterwards had been his."], ["Sipho still sleeps inside the door.", "He is fatter than he was and his one ear still will not stand up."], ["He still sits outside the gate every afternoon at four o'clock, watching the road, for no reason anybody has ever worked out.", "Lwazi thinks he is waiting for somebody. He has never said so out loud."]], "wc": 507, "words": [{"w": "shop", "m": "a place where you buy things"}, {"w": "cooldrink", "m": "a sweet cold drink"}, {"w": "gate", "m": "you open it to go into a yard"}, {"w": "window", "m": "you look out of it"}, {"w": "towel", "m": "you dry yourself with it"}, {"w": "lunchtime", "m": "the middle of the day when you eat"}, {"w": "supper", "m": "the meal in the evening"}, {"w": "doorway", "m": "the space where a door is"}, {"w": "afternoon", "m": "the time after midday"}, {"w": "stomach", "m": "the part of you that feels full"}]}, {"title": "Building the Fort", "blurb": "Four children, a pile of old zinc sheets and nine days. The fort takes three days to build and four minutes to fall down.", "n": 3, "pages": [["## One", "Behind Mr Ndlovu's house there was a pile of old zinc sheets that had been there for years."], ["Nobody used them. Grass grew up through them. They were rusty at the edges and warm on top in the sun."], ["On the second day of the holidays, Kea said, “We could build something.”", "Nobody answered for a moment. Then everybody started talking at once."], ["## Two", "There were four of them. Kea, her brother Tumi, and the two boys from the corner house."], ["They asked Mr Ndlovu. He was seventy-one and he sat outside most days and he thought about it for a long time before he answered."], ["“You may use them,” he said. “Not near the wall. And nobody climbs on top.”"], ["## Three", "The first day they made a mess.", "They dragged all the sheets out and leaned them against each other and the whole thing fell over twice before lunch."], ["The second time it fell, a sheet caught Tumi on the arm and left a long red line, not deep, but it bled a bit and he sat down and did not say anything for a while."], ["Mr Ndlovu watched all of this from his chair and did not get up."], ["## Four", "On the second day they did it differently."], ["Kea said they should stop leaning things and start tying things.", "They found wire. They found old rope. The boys from the corner house brought a bag of bread bag clips, which turned out to be useless but which they tried anyway."], ["By the end of the second day it stood up on its own. It was small and crooked and only one person could sit inside it, but it stood up."], ["## Five", "The third day was the best day."], ["They made it bigger. They put a sheet on top for a roof and weighted it with two bricks, and made a door out of a piece of board."], ["Inside it was dark and hot and smelled of rust and grass, and when the sun came through the gaps it made lines on the floor.", "All four of them fitted, if nobody moved."], ["## Six", "The wind came on the fourth day."], ["Not a storm. Just wind, the ordinary afternoon kind that comes up in September.", "They were inside when it started and they felt the whole thing lift on one side, and Kea said <i>out</i> in a voice that did not sound like hers, and they got out."], ["## Seven", "It took about four minutes to fall down completely."], ["They stood and watched it. Nobody said anything.", "Three days of work, lying flat on the grass, exactly where it had been at the beginning."], ["Tumi started to cry and then stopped himself, which was worse to watch."], ["## Eight", "Mr Ndlovu got up out of his chair, which took him a while, and came over."], ["He looked at the pile for a long time.", "“The roof was too heavy,” he said. “The wind got under it and it became a sail. You did not do anything wrong. You just did not know that yet.”"], ["“Can we build it again?” said Kea.", "“You have five days,” said Mr Ndlovu. “And this time you put the heavy things at the bottom.”"], ["They built it again. It took two days instead of three, because they already knew most of it.", "It was still standing in December."]], "wc": 554, "words": [{"w": "build", "m": "to make something out of parts"}, {"w": "rusty", "m": "old metal goes this colour"}, {"w": "lunch", "m": "the meal in the middle of the day"}, {"w": "wire", "m": "thin metal you can bend"}, {"w": "crooked", "m": "not straight"}, {"w": "brick", "m": "a hard block used for building"}, {"w": "roof", "m": "the top of a building"}, {"w": "wind", "m": "moving air"}, {"w": "heavy", "m": "it weighs a lot"}, {"w": "bottom", "m": "the lowest part"}]}, {"title": "Nine Hundred Kilometres", "blurb": "The drive to Gogo takes eleven hours. Ntando has done it every holiday of his life, and this year he decides to count.", "n": 4, "pages": [["## One", "They always left at four in the morning."], ["Ntando had never once been awake when the car started. He was carried out in a blanket and he woke up somewhere near Kroonstad with his neck sore and the sun coming up."], ["This year he decided he would stay awake for the whole thing."], ["## Two", "He lasted until twenty past four.", "He woke up at seven, exactly as usual, with his neck sore, exactly as usual."], ["“Where are we?”", "“Winburg,” said his father.", "“That is not fair. I was going to count.”", "“Count what?”", "“Everything,” said Ntando, and got out his book."], ["## Three", "He counted windmills first, because they were easy to see and there were a lot of them."], ["Between Winburg and the next town he counted twenty-six.", "Then he stopped counting windmills because his sister said windmills were boring, and she was annoying but she was right."], ["So he counted trucks instead. In one hour he counted forty-one, and eleven of them were carrying cars, which he did not know trucks did."], ["## Four", "At half past nine they stopped for petrol."], ["Ntando wrote down what it cost, because his father said it out loud and it sounded like a lot.", "He wrote down the name of the place. He wrote down what everybody bought."], ["His sister bought chips. His father bought coffee and a pie. His mother bought nothing at all, which Ntando noticed and wrote down without knowing why he was writing it down."], ["## Five", "Between eleven and one o'clock the country changed."], ["It got flatter and drier and the grass went from green to a pale yellow-brown, and then there were hills again on the left and the hills were a completely different shape from the hills at home."], ["He tried to draw one. It came out badly. He drew it again and it came out slightly less badly."], ["## Six", "At two o'clock they were all tired of each other."], ["That is a thing that happens in a car and everybody knows it and nobody says it.", "His sister put her head against the window. His father stopped talking. The radio went off and nobody put it back on."], ["Ntando wrote: <i>2 o'clock. Nobody is talking. This always happens.</i>"], ["## Seven", "They got there at half past three."], ["Gogo came out before the car had stopped, which she does every single time, and which his mother says she should not do because one day somebody will reverse over her."], ["The last thing Ntando wrote that day was: <i>Eleven and a half hours. 900 km. Gogo came out before the car stopped.</i>"], ["## Eight", "He kept the book."], ["He has done the same drive nine times since and he has written it down every time, and the books are all in a box under his bed."], ["The interesting thing, he says, is not the windmills or the trucks.", "It is that in the first book Gogo runs out to the car, and in the fourth book she walks out, and in the eighth book she is waiting at the door."], ["He did not notice that while it was happening. He only noticed it because he wrote it down."]], "wc": 521, "words": [{"w": "blanket", "m": "you put it over you when you sleep"}, {"w": "morning", "m": "the early part of the day"}, {"w": "windmill", "m": "it turns in the wind and pumps water"}, {"w": "truck", "m": "a big vehicle that carries loads"}, {"w": "petrol", "m": "cars need it to go"}, {"w": "coffee", "m": "a hot drink grown-ups like"}, {"w": "hills", "m": "small mountains"}, {"w": "radio", "m": "you listen to music and news on it"}, {"w": "tired", "m": "you need to sleep"}, {"w": "sister", "m": "a girl in your family"}]}, {"title": "The Tooth in the Tea", "blurb": "Palesa's front tooth has been wobbly for two weeks. On the third day of the holidays it finally comes out, and then she loses it.", "n": 5, "pages": [["## One", "Palesa's front tooth had been wobbly for two weeks."], ["She pushed it with her tongue all the time. At breakfast. In the bath. When she was trying to sleep."], ["“Stop playing with it,” said her mother.", "“I am not playing with it. It is playing with me.”"], ["## Two", "On the third day of the holidays she bit into an apple and felt something go."], ["She put her hand to her mouth. There was a gap. She could feel the air going through it."], ["Her tooth was not in the apple. It was not on the floor. It was not in her hand."], ["## Three", "They looked everywhere.", "Under the table. Under the chair. In the dog's bowl, which was horrible."], ["Her brother Neo lay on the kitchen floor with a torch and looked under the fridge.", "He found a bottle top and a lot of dust. He did not find a tooth."], ["Palesa sat on the step and felt terrible.", "It was her tooth. It had been in her mouth for six years. And now it was just gone."], ["## Four", "Her grandmother came out with two cups of tea and sat down next to her."], ["“Wha m.", "That was his mother's idea."], ["It went all the way down the hill, past all the houses, and round the corner at the bottom.", "Themba ran the whole way and did not lose it once."], ["At the very bottom it went into the big drain and was gone."], ["## Eight", "The rain stopped on Thursday. By Friday the road was a road again."], ["Themba still has his list. It says what sank and what floated and how far each one went.", "At the bottom it says: <i>Wax works. Paper does not. Cereal box is the best.</i>"], ["He is waiting for it to rain again.", "He has already folded the next one."]], "wc": 456, "words": [{"w": "raining", "m": "water is falling from the sky"}, {"w": "window", "m": "you look out of it"}, {"w": "corners", "m": "the pointed ends of a square"}, {"w": "gumboots", "m": "rubber boots for wet days"}, {"w": "paper", "m": "you write on it"}, {"w": "newspaper", "m": "you read the news in it"}, {"w": "magazine", "m": "a thin shiny book with pictures"}, {"w": "floated", "m": "stayed on top of the water"}, {"w": "candle", "m": "it has a wick and gives light"}, {"w": "drain", "m": "water runs away down it"}]}, {"title": "The Boy Next Door", "blurb": "A new family moves in next door. Their son is the same age as Kagiso, and he does not speak any English at all.", "n": 7, "pages": [["## One", "A truck came on the first Saturday of the holidays and parked outside the empty house next door."], ["Two men carried in beds and a table and a lot of boxes.", "Then a car came with a mother, a father, a baby, and a boy."], ["The boy was about Kagiso's size. He stood on the pavement and looked at everything very carefully."], ["## Two", "Kagiso went to the fence.", "“Hello,” he said. “I am Kagiso.”"], ["The boy looked at him. He smiled a bit. He did not say anything."], ["“What is your name?”", "The boy smiled again and shook his head, and then he said something that Kagiso did not understand one word of."], ["## Three", "His mother explained it at supper.", "“They have co ": "windows", "m": "you look out of these"}, {"w": "carefully", "m": "taking care"}]}];
const KEY = "g2-holiday";
let state={}, cur=-1, pg=0, fs=19, mode="listen";
const VOICE = ("speechSynthesis" in window);

async function load(){
  try{const r=await window.storage.get(KEY);state=r?JSON.parse(r.value):{};return;}catch(e){}
  try{const v=window.localStorage.getItem(KEY);state=v?JSON.parse(v):{};}catch(e){state={};}
}
async function save(){
  try{if(window.storage){await window.storage.set(KEY,JSON.stringify(state));return;}}catch(e){}
  try{window.localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}
}
function say(t){
  if(!VOICE) return;
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(t); u.rate=.72; u.lang="en-ZA";
  window.speechSynthesis.speak(u);
}
function drawShelf(){
  const el=document.getElementById("shelf"); el.innerHTML="";
  BOOKS.forEach((b,i)=>{
    const st=state[i]||{};
    const btn=document.createElement("button"); btn.className="book";
    let tag="";
    if(st.best!==undefined) tag=`<span class="badge">Spelling ${st.best}/${b.words.length}</span>`;
    else if(st.page) tag=`<span class="resume">Carry on &#8212; page ${st.page+1}</span>`;
    btn.innerHTML=`<span class="spine"><small style="font-size:11px;display:block;font-family:IBM Plex Mono,monospace;letter-spacing:.08em">DAY</small>${b.n}</span><span>
      <span class="bt">${b.title}</span><span class="bb">${b.blurb}</span>
      <span class="meta"><span>24 pages</span><span>${b.wc} words</span>${tag}</span></span>`;
    btn.addEventListener("click",()=>open(i));
    el.appendChild(btn);
  });
}
function open(i){
  cur=i; pg=(state[i]&&state[i].page)?state[i].page:0;
  document.getElementById("shelfview").classList.add("off");
  document.getElementById("reader").classList.add("on");
  document.getElementById("rtitle").textContent=BOOKS[i].title;
  document.getElementById("novoice").classList.toggle("on",!VOICE);
  if(!VOICE) setMode("mean"); else setMode(mode);
  draw(); window.scrollTo(0,0);
}
function draw(){
  const b=BOOKS[cur], last=pg>=b.pages.length;
  document.getElementById("storyview").style.display=last?"none":"block";
  document.getElementById("sp").classList.toggle("on",last);
  if(!last){
    document.getElementById("page").innerHTML=b.pages[pg].map(l=>
      l.startsWith("## ")?`<h2 class="chap">${l.slice(3)}</h2>`:`<p>${l}</p>`).join("");
    document.getElementById("pnum").textContent=`${pg+1} of ${b.pages.length}`;
    document.getElementById("prev").disabled=pg===0;
    document.getElementById("next").textContent=pg===b.pages.length-1?"Spelling test":"Next";
    document.getElementById("bar").style.width=((pg+1)/b.pages.length*100)+"%";
  }
  state[cur]=Object.assign({},state[cur],{page:Math.min(pg,b.pages.length-1)});
  save();
}
function setMode(m){
  mode=m;
  document.getElementById("mListen").setAttribute("aria-pressed",m==="listen");
  document.getElementById("mMean").setAttribute("aria-pressed",m==="mean");
  document.getElementById("si").textContent = m==="listen"
    ? "Press Say it. The laptop reads a word from the book out loud. Type it, then press Check."
    : "Read what the word means. Write the word. The first letter and the number of letters are given to help you.";
  buildItems();
}
function buildItems(){
  const b=BOOKS[cur], el=document.getElementById("items"); el.innerHTML="";
  b.words.forEach((it,i)=>{
    const d=document.createElement("div"); d.className="item";
    const top = mode==="listen"
      ? `<button class="say" data-w="${it.w}">&#9654; Say it</button>
         <span class="clue hint" id="h${i}"></span>`
      : `<span class="clue">${it.m}
         <span class="hint">&nbsp;&nbsp;${it.w[0].toUpperCase()} &#183; ${it.w.length} letters</span></span>`;
    d.innerHTML=`<div class="itop"><span class="n">${i+1}.</span>${top}</div>
      <div class="ans"><input type="text" autocomplete="off" autocapitalize="off"
        spellcheck="false" aria-label="Word ${i+1}"><span class="tick" id="t${i}"></span></div>`;
    el.appendChild(d);
  });
  el.querySelectorAll(".say").forEach((btn,i)=>{
    btn.addEventListener("click",()=>{
      say(btn.dataset.w);
      document.getElementById("h"+i).textContent = btn.dataset.w.length + " letters";
    });
  });
  document.getElementById("score").classList.remove("on");
}
function check(){
  const b=BOOKS[cur], inputs=document.querySelectorAll("#items input");
  let right=0;
  inputs.forEach((inp,i)=>{
    const ok=inp.value.trim().toLowerCase()===b.words[i].w.toLowerCase();
    inp.classList.toggle("ok",ok);
    inp.classList.toggle("no",!ok&&inp.value.trim()!=="");
    const t=document.getElementById("t"+i);
    t.textContent=ok?"\u2713":(inp.value.trim()?"\u2717":"");
    t.className="tick "+(ok?"ok":"no");
    if(ok) right++;
  });
  const n=b.words.length, s=document.getElementById("score");
  let msg;
  if(right===n) msg=`<b>${right} out of ${n}.</b> Every single one. Go and tell somebody.`;
  else if(right>=n-2) msg=`<b>${right} out of ${n}.</b> Nearly all of them. Try the red ones once more.`;
  else if(right>=n/2) msg=`<b>${right} out of ${n}.</b> Good going. Sound out the red ones slowly.`;
  else msg=`<b>${right} out of ${n}.</b> Try the other button &#8212; it gives you the meaning and the first letter.`;
  s.innerHTML=msg; s.classList.add("on");
  const prev=(state[cur]&&state[cur].best)||0;
  state[cur]=Object.assign({},state[cur],{best:Math.max(prev,right)});
  save();
}
document.getElementById("next").addEventListener("click",()=>{if(pg<BOOKS[cur].pages.length){pg++;draw();window.scrollTo(0,0);}});
document.getElementById("prev").addEventListener("click",()=>{if(pg>0){pg--;draw();window.scrollTo(0,0);}});
document.getElementById("back").addEventListener("click",()=>{
  if(VOICE) window.speechSynthesis.cancel();
  document.getElementById("reader").classList.remove("on");
  document.getElementById("shelfview").classList.remove("off");
  drawShelf(); window.scrollTo(0,0);});
document.getElementById("check").addEventListener("click",check);
document.getElementById("clear").addEventListener("click",buildItems);
document.getElementById("reread").addEventListener("click",()=>{pg=0;draw();window.scrollTo(0,0);});
document.getElementById("mListen").addEventListener("click",()=>setMode("listen"));
document.getElementById("mMean").addEventListener("click",()=>setMode("mean"));
document.getElementById("bigger").addEventListener("click",()=>{fs=Math.min(fs+2,31);
  document.documentElement.style.setProperty("--fs",fs+"px");});
document.getElementById("smaller").addEventListener("click",()=>{fs=Math.max(fs-2,15);
  document.documentElement.style.setProperty("--fs",fs+"px");});
document.addEventListener("keydown",e=>{
  if(!document.getElementById("reader").classList.contains("on")) return;
  if(document.activeElement.tagName==="INPUT") return;
  if(e.key==="ArrowRight") document.getElementById("next").click();
  if(e.key==="ArrowLeft") document.getElementById("prev").click();});
load().then(drawShelf);
</script>
</body>
